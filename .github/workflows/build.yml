name: Build PediaRef Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract original project
        run: |
          mkdir -p project
          unzip -q grok-workspace.zip -d project

          test -f project/package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create offline application entry
        working-directory: project
        run: |
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0, viewport-fit=cover"
              />
              <meta name="theme-color" content="#f4f1ea" />
              <title>PediaRef</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/offline-main.tsx"></script>
            </body>
          </html>
          EOF

          cat > offline-main.tsx <<'EOF'
          import { useEffect, useState } from "react";
          import { createRoot } from "react-dom/client";
          import { DosePanel } from "./src/components/dose-panel";
          import { FluidsPanel } from "./src/components/fluids-panel";
          import { GrowthPanel } from "./src/components/growth-panel";
          import { LogPanel } from "./src/components/log-panel";
          import { PatientCards, PatientPanel } from "./src/components/patient-panel";
          import { usePatient } from "./src/lib/patient-store";
          import { cn } from "./src/lib/utils";
          import "./src/styles.css";

          const TABS = [
            { id: "patient", label: "Patient" },
            { id: "growth", label: "Growth" },
            { id: "doses", label: "Doses" },
            { id: "fluids", label: "Fluids" },
            { id: "log", label: "Log" },
          ] as const;

          type TabId = (typeof TABS)[number]["id"];

          function OfflineApp() {
            const [tab, setTab] = useState<TabId>("doses");
            const [showCase, setShowCase] = useState(false);
            const logCount = usePatient((s) => s.log.length);

            useEffect(() => {
              void usePatient.persist.rehydrate();
            }, []);

            return (
              <div className="min-h-dvh">
                <header className="sticky top-0 z-30 border-b border-border bg-bg/90">
                  <div className="mx-auto flex h-14 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
                    <div className="flex items-center gap-2.5 text-fg">
                      <span className="flex size-8 items-center justify-center rounded-sm bg-accent text-accent-fg">
                        <svg viewBox="0 0 24 24" className="size-4" fill="none" aria-hidden="true">
                          <path d="M4 16c2-6 4-9 8-9s6 3 8 9" stroke="currentColor" strokeWidth="1.75" />
                          <circle cx="12" cy="7" r="1.4" fill="currentColor" />
                        </svg>
                      </span>
                      <span className="font-display text-lg">PediaRef</span>
                    </div>
                    <span className="text-xs text-muted">Offline reference</span>
                  </div>
                </header>

                <main className="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 sm:py-8">
                  <section className="max-w-3xl">
                    <p className="text-xs uppercase tracking-mark text-accent">Pediatric reference</p>
                    <h1 className="mt-2 font-display text-4xl leading-tight tracking-tight sm:text-5xl">
                      Weight in. Dose out.
                    </h1>
                    <p className="mt-3 max-w-xl text-muted">
                      Age-smart mg/kg, WHO weight-for-age, Holliday–Segar fluids, and pump rates — a bedside calculator rebuilt for the ward, not a prescription.
                    </p>
                  </section>

                  <div className="mt-8 grid min-w-0 gap-6 lg:grid-cols-[minmax(0,20rem)_minmax(0,1fr)]">
                    <div className="min-w-0 lg:sticky lg:top-20 lg:self-start">
                      <button
                        type="button"
                        className="mb-3 flex h-11 w-full items-center justify-between rounded-md bg-surface px-4 text-sm shadow-border lg:hidden"
                        onClick={() => setShowCase((v) => !v)}
                        aria-expanded={showCase}
                      >
                        <span>Patient console</span>
                        <span className="text-muted">{showCase ? "Hide" : "Edit"}</span>
                      </button>
                      <div className={cn(showCase ? "block" : "hidden", "lg:block")}>
                        <PatientPanel />
                      </div>
                    </div>

                    <div className="min-w-0">
                      <div className="flex gap-1.5 overflow-x-auto pb-2">
                        {TABS.map((t) => (
                          <button
                            key={t.id}
                            type="button"
                            onClick={() => setTab(t.id)}
                            className={cn(
                              "h-11 shrink-0 rounded-full px-4 text-sm transition-[background-color,color] duration-150",
                              tab === t.id
                                ? "bg-fg text-bg"
                                : "bg-surface text-muted shadow-border hover:text-fg",
                            )}
                          >
                            {t.label}
                            {t.id === "log" && logCount > 0 ? (
                              <span className="ml-1.5 font-mono text-xs tabular-nums">{logCount}</span>
                            ) : null}
                          </button>
                        ))}
                      </div>

                      <div className="mt-5">
                        {tab === "patient" ? (
                          <div className="space-y-4">
                            <h2 className="font-display text-3xl tracking-tight">Case snapshot</h2>
                            <PatientCards />
                          </div>
                        ) : null}
                        {tab === "growth" ? <GrowthPanel /> : null}
                        {tab === "doses" ? <DosePanel /> : null}
                        {tab === "fluids" ? <FluidsPanel /> : null}
                        {tab === "log" ? <LogPanel /> : null}
                      </div>
                    </div>
                  </div>

               <div className="mt-10 max-w-3xl">
                 <p className="mb-2 text-center text-xs font-medium text-muted">
                  Made With Love By: Dr. SULAIMAN ALMAJEEDI
                 </p>
                 <p className="text-xs leading-relaxed text-subtle">
                 Educational reference only — not a prescribing chart. Verify every dose,
                 dilution, and indication against your unit protocol and a supervising clinician.
                 Patient entries stay on this device.
                </p>
              </div>
                </main>
              </div>
            );
          }

          createRoot(document.getElementById("root")!).render(<OfflineApp />);
          EOF

          cat > vite.offline.config.ts <<'EOF'
          import { resolve } from "node:path";
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import tailwindcss from "@tailwindcss/vite";

          export default defineConfig({
            plugins: [tailwindcss(), react()],
            resolve: {
              alias: {
                "@": resolve(process.cwd(), "src"),
              },
            },
            build: {
              outDir: "dist-offline",
              emptyOutDir: true,
            },
          });
          EOF

      - name: Install project dependencies
        working-directory: project
        run: npm install --no-audit --no-fund

      - name: Build offline web application
        working-directory: project
        run: npx vite build --config vite.offline.config.ts

      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core@^7 @capacitor/android@^7 --no-audit --no-fund
          npm install --save-dev @capacitor/cli@^7 --no-audit --no-fund

      - name: Configure Android application
        working-directory: project
        run: |
          npx cap init PediaRef com.suaito.pediaref --web-dir dist-offline
          npx cap add android
          npx cap sync android
          
      - name: Apply PediaRef Light Android Icon
        working-directory: project
        run: |
          python -m pip install Pillow

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("public/pediaref-light-icon-1024.png")
          res = Path("android/app/src/main/res")

          if not source.exists():
              raise SystemExit(
                  f"ERROR: Icon image not found: {source}"
              )

          original = Image.open(source).convert("RGBA")

          # Crop the complete PediaRef symbol.
          # Exclude the PediaRef wordmark below it.
          symbol = original.crop((180, 35, 845, 700))

          # Create a square light-background icon with balanced padding.
          canvas_size = 1024
          icon_canvas = Image.new(
              "RGBA",
              (canvas_size, canvas_size),
              (255, 255, 255, 255)
          )

          symbol_size = 860
          symbol.thumbnail(
              (symbol_size, symbol_size),
              Image.Resampling.LANCZOS
          )

          x = (canvas_size - symbol.width) // 2
          y = (canvas_size - symbol.height) // 2

          icon_canvas.alpha_composite(symbol, (x, y))

          # Generate standard Android launcher icons.
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = icon_canvas.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )
              
      - name: Apply PediaRef Light Android Icon
        working-directory: project
        run: |
          python -m pip install Pillow

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("public/pediaref-light-icon-1024.png")
          res = Path("android/app/src/main/res")

          if not source.exists():
              raise SystemExit(f"Icon not found: {source}")

          original = Image.open(source).convert("RGBA")

          # Prepare a square icon canvas.
          original.thumbnail((1024, 1024), Image.Resampling.LANCZOS)

          canvas = Image.new(
              "RGBA",
              (1024, 1024),
              (235, 246, 255, 255)
          )

          # Preserve the complete artwork and its outer edges.
          # Add safe margins to prevent launcher-mask cropping.
          artwork = original.copy()
          artwork.thumbnail((820, 820), Image.Resampling.LANCZOS)

          x = (1024 - artwork.width) // 2
          y = (1024 - artwork.height) // 2

          canvas.alpha_composite(artwork, (x, y))

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              resized = canvas.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(folder / "ic_launcher.png")
              resized.save(folder / "ic_launcher_round.png")

              # Keep the entire artwork within the adaptive safe zone.
              fg_canvas = Image.new(
                  "RGBA",
                  (432, 432),
                  (0, 0, 0, 0)
              )

              fg = canvas.resize(
                  (350, 350),
                  Image.Resampling.LANCZOS
              )

              fg_canvas.alpha_composite(fg, (41, 41))

              fg_canvas.save(
                  folder / "ic_launcher_foreground.png"
              )

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)

          xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/pediaref_icon_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """

          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)

          colors = res / "values"
          colors.mkdir(parents=True, exist_ok=True)

          color_xml = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="pediaref_icon_background">#EBF6FF</color>
          </resources>
          """

          (colors / "pediaref_icon_colors.xml").write_text(color_xml)

          print("PediaRef icon updated with safe margins and visible edges.")
          PY
    
      - name: Build Android APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PediaRef-Offline-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
